<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLIPE 管理后台</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/vendor/element-plus.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="app-template">
    <!-- 登录 -->
    <div v-if="!token" class="login-wrap">
      <div class="login-card">
        <div class="brand-block">
          <div class="brand-logo">S</div>
          <div>
            <h1>SLIPE 管理后台</h1>
            <p class="brand-sub">workadmin.lineregre.com</p>
          </div>
        </div>
        <el-form @submit.prevent>
          <el-input
            v-model="loginPassword"
            type="password"
            show-password
            size="large"
            placeholder="请输入管理员密码"
            @keyup.enter="login"
          />
          <el-button
            class="login-btn"
            type="primary"
            size="large"
            :loading="loggingIn"
            @click="login"
          >登 录</el-button>
        </el-form>
        <p class="login-tip">敏感操作需再次输入管理员密码进行二次验证。</p>
      </div>
    </div>

    <!-- 主界面 -->
    <div v-else class="layout">
      <aside class="sidebar">
        <div class="brand-block small">
          <div class="brand-logo">S</div>
          <div>
            <h1>SLIPE</h1>
            <p class="brand-sub">WorkAdmin</p>
          </div>
        </div>
        <el-menu :default-active="tab" class="menu" @select="selectTab">
          <el-menu-item index="overview">概览统计</el-menu-item>
          <el-menu-item index="users">用户管理</el-menu-item>
          <el-menu-item index="activation">激活码充值</el-menu-item>
          <el-menu-item index="config">凭据配置</el-menu-item>
          <el-menu-item index="llm">LLM 模型</el-menu-item>
          <el-menu-item index="docs">使用文档</el-menu-item>
          <el-menu-item index="releases">安装包</el-menu-item>
          <el-menu-item index="orders">支付订单</el-menu-item>
          <el-menu-item index="community">社区内容</el-menu-item>
          <el-menu-item index="communitySettings">社区设置</el-menu-item>
          <el-menu-item index="policies">政策合规</el-menu-item>
        </el-menu>
        <div class="sidebar-footer">
          <span class="dot" :class="online ? 'ok' : 'bad'"></span>
          {{ online ? 'API 在线' : 'API 异常' }}
          <el-button link class="logout" @click="logout">退出</el-button>
        </div>
      </aside>

      <main class="main">
        <!-- 概览 -->
        <section v-if="tab === 'overview'" class="panel">
          <header class="panel-head">
            <div>
              <h2>概览统计</h2>
              <p>数据来自后端实时统计，按服务器本地时间归档。</p>
            </div>
            <el-button :loading="loadingStats" @click="loadStats">刷新</el-button>
          </header>

          <div class="stat-grid">
            <div class="stat-card">
              <span class="stat-label">注册用户</span>
              <strong class="stat-value">{{ fmt(stats.users.count) }}</strong>
              <span class="stat-foot">今日新增 {{ fmt(stats.users.newToday) }}</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">累计登录</span>
              <strong class="stat-value">{{ fmt(stats.totals.logins) }}</strong>
              <span class="stat-foot">今日 {{ fmt(stats.today.logins) }} · 今日活跃 {{ fmt(stats.users.activeToday) }}</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">极验通过 / 失败</span>
              <strong class="stat-value">{{ fmt(stats.totals.captchaPass) }}<em> / {{ fmt(stats.totals.captchaFail) }}</em></strong>
              <span class="stat-foot">短信下发 {{ fmt(stats.totals.smsSent) }}</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">LLM 调用 / Token</span>
              <strong class="stat-value">{{ fmt(stats.totals.llmCalls) }}</strong>
              <span class="stat-foot">{{ fmt(stats.totals.tokensUsed) }} tokens</span>
            </div>
          </div>

          <div class="card chart-card">
            <div class="card-head">
              <h3>最近 14 天注册 / 登录</h3>
              <span class="legend"><i class="lg-reg"></i>注册 <i class="lg-login"></i>登录</span>
            </div>
            <div class="chart">
              <div v-for="d in stats.daily" :key="d.date" class="chart-col">
                <div class="bars">
                  <div class="bar reg" :style="{ height: barHeight(d.registers) }"></div>
                  <div class="bar login" :style="{ height: barHeight(d.logins) }"></div>
                </div>
                <span class="chart-label">{{ d.date.slice(5) }}</span>
              </div>
            </div>
          </div>

          <div class="two-col">
            <div class="card">
              <div class="card-head"><h3>服务状态</h3></div>
              <dl class="kv">
                <dt>运行时长</dt><dd>{{ uptimeText }}</dd>
                <dt>内存占用</dt><dd>{{ stats.server.memoryMb }} MB</dd>
                <dt>Node 版本</dt><dd>{{ stats.server.nodeVersion }}</dd>
                <dt>LLM 模型</dt><dd>{{ stats.content.llmModels }} 个</dd>
                <dt>云同步项目</dt><dd>{{ stats.content.projects }} 个用户</dd>
                <dt>对话记录</dt><dd>{{ stats.content.chatHistories }} 个用户</dd>
              </dl>
            </div>
            <div class="card">
              <div class="card-head"><h3>第三方凭据</h3></div>
              <dl class="kv">
                <dt>极验</dt>
                <dd>
                  <el-tag :type="stats.config.geetest.configured ? 'success' : 'warning'" size="small">
                    {{ stats.config.geetest.configured ? '已配置' : '未配置' }}
                  </el-tag>
                  <span class="mono dim">{{ stats.config.geetest.captchaId || '-' }}</span>
                  <span class="mono dim">{{ stats.config.geetest.captchaKeyMasked || '-' }}</span>
                </dd>
                <dt>校验开关</dt>
                <dd>{{ stats.config.geetest.enforce ? '强制校验' : '已关闭（调试）' }}</dd>
                <dt>阿里云短信</dt>
                <dd>
                  <el-tag :type="stats.config.aliyun.configured ? 'success' : 'info'" size="small">
                    {{ stats.config.aliyun.configured ? '已配置' : '开发模式' }}
                  </el-tag>
                  <span class="mono dim">{{ stats.config.aliyun.accessKeyId || '-' }}</span>
                  <span class="mono dim">{{ stats.config.aliyun.accessKeySecretMasked || '-' }}</span>
                </dd>
                <dt>短信签名</dt>
                <dd>{{ stats.config.aliyun.signName }} / {{ stats.config.aliyun.templateCode }}</dd>
              </dl>
            </div>
          </div>
          <div class="card" style="margin-top: 16px">
            <div class="card-head">
              <h3>模型调用统计</h3>
              <span class="dim">按内置模型 / 线路聚合，用于观察路由与失败情况</span>
            </div>
            <el-table :data="stats.llm.models" stripe size="small" empty-text="暂无调用记录">
              <el-table-column prop="name" label="模型" min-width="150" />
              <el-table-column label="调用次数" width="110">
                <template #default="{ row }">{{ fmt(row.calls) }}</template>
              </el-table-column>
              <el-table-column label="Token" width="130">
                <template #default="{ row }">{{ fmt(row.tokens) }}</template>
              </el-table-column>
              <el-table-column label="失败" width="90">
                <template #default="{ row }">
                  <el-tag v-if="row.errors" type="danger" size="small">{{ row.errors }}</el-tag>
                  <span v-else class="dim">0</span>
                </template>
              </el-table-column>
              <el-table-column label="最近调用" min-width="160">
                <template #default="{ row }">{{ dateText(row.lastAt) }}</template>
              </el-table-column>
            </el-table>
          </div>

          <div class="card" style="margin-top: 16px">
            <div class="card-head">
              <h3>线路调用分布</h3>
              <span class="dim">多组 BaseURL / APIKey 的智能路由结果</span>
            </div>
            <el-table :data="stats.llm.channels" stripe size="small" empty-text="暂无线路记录">
              <el-table-column prop="modelName" label="模型" min-width="130" />
              <el-table-column prop="channelName" label="线路" min-width="130" />
              <el-table-column label="调用" width="90">
                <template #default="{ row }">{{ fmt(row.calls) }}</template>
              </el-table-column>
              <el-table-column label="Token" width="120">
                <template #default="{ row }">{{ fmt(row.tokens) }}</template>
              </el-table-column>
              <el-table-column label="失败" width="90">
                <template #default="{ row }">
                  <el-tag v-if="row.errors" type="danger" size="small">{{ row.errors }}</el-tag>
                  <span v-else class="dim">0</span>
                </template>
              </el-table-column>
              <el-table-column prop="lastError" label="最近错误" min-width="200" show-overflow-tooltip />
            </el-table>
          </div>
          <!-- CHUNK-2-END -->
        </section>

        <!-- 用户 -->
        <section v-else-if="tab === 'users'" class="panel">
          <header class="panel-head">
            <div>
              <h2>用户管理</h2>
              <p>查看用户资料需要二次输入管理员密码。</p>
            </div>
            <el-button :loading="loadingUsers" @click="loadUsers">刷新</el-button>
          </header>

          <div class="card">
            <div class="toolbar">
              <el-input
                v-model="userQuery"
                placeholder="搜索邮箱 / 昵称 / 手机号"
                clearable
                style="max-width: 320px"
                @keyup.enter="loadUsers"
                @clear="loadUsers"
              />
              <span class="dim">共 {{ usersTotal }} 位用户</span>
            </div>

            <el-table :data="pagedUsers" stripe empty-text="暂无用户">
              <el-table-column prop="displayName" label="昵称" min-width="120" />
              <el-table-column prop="email" label="邮箱" min-width="200" />
              <el-table-column prop="phone" label="手机号" width="130" />
              <el-table-column label="积分" width="90">
                <template #default="{ row }">{{ fmt(row.credits) }}</template>
              </el-table-column>
              <el-table-column label="注册时间" min-width="160">
                <template #default="{ row }">{{ dateText(row.createdAt) }}</template>
              </el-table-column>
              <el-table-column label="最近登录" min-width="160">
                <template #default="{ row }">{{ dateText(row.lastLoginAt) }}</template>
              </el-table-column>
              <el-table-column label="操作" width="170" fixed="right">
                <template #default="{ row }">
                  <el-button link type="primary" @click="askDetail(row)">详情</el-button>
                  <el-button link type="primary" @click="openCredits(row)">调整积分</el-button>
                </template>
              </el-table-column>
            </el-table>

            <div class="pager">
              <el-pagination
                layout="prev, pager, next"
                :total="usersTotal"
                :page-size="pageSize"
                :current-page="currentPage"
                @current-change="onPageChange"
              />
            </div>
          </div>
        </section>
        <!-- 配置 -->
        <section v-else-if="tab === 'config'" class="panel">
          <header class="panel-head">
            <div>
              <h2>凭据配置</h2>
              <p>保存后立即生效（写入数据库，优先于环境变量）。密钥留空表示不修改。</p>
            </div>
            <el-button :loading="loadingConfig" @click="loadConfig">重新读取</el-button>
          </header>

          <div class="card">
            <div class="card-head">
              <h3>极验验证码（GT4）</h3>
              <el-switch v-model="cfg.geetest.enforce" active-text="强制校验" />
            </div>
            <el-form label-width="120px" class="cfg-form">
              <el-form-item label="Captcha ID">
                <el-input v-model="cfg.geetest.captchaId" placeholder="极验后台的 Captcha ID" />
              </el-form-item>
              <el-form-item label="Captcha Key">
                <el-input
                  v-model="cfg.geetest.captchaKey"
                  type="password"
                  show-password
                  :placeholder="placeholderSecret(cfgInfo.geetest.captchaKeyMasked)"
                />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingGee" @click="saveGeetest">保存极验配置</el-button>
                <span class="dim" v-if="cfgInfo.geetest.captchaKeyMasked">
                  当前 Key：{{ cfgInfo.geetest.captchaKeyMasked }}
                </span>
              </el-form-item>
            </el-form>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>阿里云短信（号码认证服务）</h3>
              <el-tag :type="cfgInfo.aliyun.devMode ? 'warning' : 'success'" size="small">
                {{ cfgInfo.aliyun.devMode ? '当前为开发模式（固定验证码 123456）' : '已启用真实短信' }}
              </el-tag>
            </div>
            <el-form label-width="120px" class="cfg-form">
              <el-form-item label="AccessKey ID">
                <el-input v-model="cfg.aliyun.accessKeyId" placeholder="LTAI..." />
              </el-form-item>
              <el-form-item label="AccessKey Secret">
                <el-input
                  v-model="cfg.aliyun.accessKeySecret"
                  type="password"
                  show-password
                  :placeholder="placeholderSecret(cfgInfo.aliyun.accessKeySecretMasked)"
                />
              </el-form-item>
              <el-form-item label="短信签名">
                <el-input v-model="cfg.aliyun.signName" placeholder="恒创联众" />
              </el-form-item>
              <el-form-item label="模板编号">
                <el-input v-model="cfg.aliyun.templateCode" placeholder="100001" />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingAli" @click="saveAliyun">保存阿里云配置</el-button>
                <span class="dim" v-if="cfgInfo.aliyun.accessKeySecretMasked">
                  当前 Secret：{{ cfgInfo.aliyun.accessKeySecretMasked }}
                </span>
              </el-form-item>
            </el-form>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>微信支付（JSAPI 会员）</h3>
              <el-tag :type="cfgInfo.wechatPay.ready ? 'success' : 'warning'" size="small">
                {{ cfgInfo.wechatPay.ready ? '已就绪' : '未配置完整' }}
              </el-tag>
            </div>
            <el-form label-width="150px" class="cfg-form">
              <el-form-item label="公众号 AppID">
                <el-input v-model="cfg.wechatPay.appId" placeholder="wx..." />
              </el-form-item>
              <el-form-item label="公众号 AppSecret">
                <el-input
                  v-model="cfg.wechatPay.appSecret"
                  type="password"
                  show-password
                  :placeholder="placeholderSecret(cfgInfo.wechatPay.appSecretMasked)"
                />
              </el-form-item>
              <el-form-item label="商户号 MchID">
                <el-input v-model="cfg.wechatPay.mchId" placeholder="1117219917" />
              </el-form-item>
              <el-form-item label="证书序列号">
                <el-input v-model="cfg.wechatPay.serialNo" placeholder="23EA..." />
              </el-form-item>
              <el-form-item label="APIv3 密钥">
                <el-input
                  v-model="cfg.wechatPay.apiV3Key"
                  type="password"
                  show-password
                  maxlength="32"
                  :placeholder="placeholderSecret(cfgInfo.wechatPay.apiV3KeyMasked)"
                />
              </el-form-item>
              <el-form-item label="支付页域名">
                <el-input v-model="cfg.wechatPay.pageBase" placeholder="https://ser1996.niav.cn" />
              </el-form-item>
              <el-form-item label="回调地址">
                <el-input v-model="cfg.wechatPay.notifyUrl" placeholder="留空自动使用 https://ser1996.niav.cn/api/pay/wechat/notify" />
              </el-form-item>
              <el-form-item label="商户私钥 PEM">
                <el-input
                  v-model="cfg.wechatPay.privateKeyPem"
                  type="textarea"
                  :rows="4"
                  :placeholder="cfgInfo.wechatPay.privateKeyConfigured ? '已配置（留空表示不修改）' : '粘贴 apiclient_key.pem 内容'"
                />
              </el-form-item>
              <el-form-item label="商户私钥文件路径">
                <el-input v-model="cfg.wechatPay.privateKeyPath" placeholder="可选：/www/wwwroot/slipecode-api/secrets/apiclient_key.pem" />
              </el-form-item>
              <el-form-item label="微信支付公钥 PEM">
                <el-input
                  v-model="cfg.wechatPay.publicKeyPem"
                  type="textarea"
                  :rows="4"
                  :placeholder="cfgInfo.wechatPay.publicKeyConfigured ? '已配置（留空表示不修改）' : '粘贴微信支付公钥 pub_key.pem 内容'"
                />
              </el-form-item>
              <el-form-item label="微信支付公钥 ID">
                <el-input v-model="cfg.wechatPay.publicKeyId" placeholder="PUB_KEY_ID_..." />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingWechatPay" @click="saveWechatPay">
                  保存微信支付配置
                </el-button>
                <span class="dim" style="margin-left: 8px">
                  支付页：{{ cfg.wechatPay.pageBase }}/pay?order=…
                </span>
              </el-form-item>
            </el-form>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>QQ 群引流</h3>
              <el-tag :type="cfg.portal.qqGroup ? 'success' : 'info'" size="small">
                {{ cfg.portal.qqGroup ? '已设置，App 端可见' : '未设置，App 端不显示' }}
              </el-tag>
            </div>
            <el-form label-width="120px" class="cfg-form">
              <el-form-item label="QQ 群号">
                <el-input v-model="cfg.portal.qqGroup" placeholder="例如 123456789（留空则 App 端隐藏入口）" />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingPortal" @click="savePortal">保存群号</el-button>
              </el-form-item>
            </el-form>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>AI 附件上传限制</h3>
              <el-tag :type="cfg.aiUploads.enabled ? 'success' : 'info'" size="small">
                {{ cfg.aiUploads.enabled ? '已开启' : '已关闭' }}
              </el-tag>
            </div>
            <el-form label-width="150px" class="cfg-form">
              <el-form-item label="允许上传附件">
                <el-switch v-model="cfg.aiUploads.enabled" active-text="开启" />
              </el-form-item>
              <el-form-item label="单次最大附件数">
                <el-input-number v-model="cfg.aiUploads.maxFiles" :min="1" :max="20" />
              </el-form-item>
              <el-form-item label="单文件最大体积（MB）">
                <el-input-number v-model="cfg.aiUploads.maxFileMb" :min="1" :max="100" />
              </el-form-item>
              <el-form-item label="单次总大小（MB）">
                <el-input-number v-model="cfg.aiUploads.maxTotalMb" :min="1" :max="200" />
              </el-form-item>
              <el-form-item label="Zip 解压最大文件数">
                <el-input-number v-model="cfg.aiUploads.maxUnzipFiles" :min="1" :max="500" />
              </el-form-item>
              <el-form-item label="Zip 解压总大小（MB）">
                <el-input-number v-model="cfg.aiUploads.maxUnzipMb" :min="1" :max="500" />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingAiUploads" @click="saveAiUploads">
                  保存附件限制
                </el-button>
                <span class="dim" style="margin-left: 8px">
                  Zip 会在服务端解压到临时目录，读取文本后返回给模型
                </span>
              </el-form-item>
            </el-form>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>GitHub 专用 Hosts</h3>
              <el-tag type="info" size="small">仅应用内部生效</el-tag>
            </div>
            <p class="dim" style="margin: 0 0 12px">
              服务端每天从公共源拉取 hosts，客户端下载后仅用于应用内 HTTP 请求；
              不修改系统 hosts，不涉及 VPN / 代理，系统浏览器中的 OAuth 不受影响。
            </p>
            <el-form label-width="150px" class="cfg-form">
              <el-form-item>
                <el-button :loading="refreshingHosts" @click="refreshGithubHosts">
                  立即从源拉取
                </el-button>
              </el-form-item>
            </el-form>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>管理员密码</h3>
              <el-tag :type="cfgInfo.admin.usingDefaultPassword ? 'warning' : 'success'" size="small">
                {{ cfgInfo.admin.usingDefaultPassword ? '仍在使用默认密码，建议立即修改' : '已自定义' }}
              </el-tag>
            </div>
            <el-form label-width="120px" class="cfg-form">
              <el-form-item label="当前密码">
                <el-input v-model="pwdForm.current" type="password" show-password placeholder="用于二次验证" />
              </el-form-item>
              <el-form-item label="新密码">
                <el-input v-model="pwdForm.next" type="password" show-password placeholder="至少 8 位" />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingPwd" @click="saveAdminPassword">修改管理员密码</el-button>
              </el-form-item>
            </el-form>
          </div>
        </section>

        <!-- LLM 模型 -->
        <section v-else-if="tab === 'llm'" class="panel">
          <header class="panel-head">
            <div>
              <h2>LLM 模型</h2>
              <p>App 内置 AI 代理使用的上游模型与积分倍率。</p>
            </div>
            <div class="toolbar">
              <el-button :loading="loadingModels" @click="loadModels">刷新</el-button>
              <el-button type="primary" @click="openModelDialog()">新增模型</el-button>
            </div>

              <el-select v-model="orderStatus" style="width: 160px" @change="loadOrders">
                <el-option label="全部" value="" />
                <el-option label="待支付" value="pending" />
                <el-option label="已支付" value="paid" />
                <el-option label="已关闭" value="closed" />
              </el-select>
              <span class="dim">共 {{ orders.length }} 条</span>
            </div>
            <el-table :data="orders" stripe empty-text="暂无订单" v-loading="loadingOrders">
              <el-table-column prop="outTradeNo" label="商户订单号" min-width="220" show-overflow-tooltip />
              <el-table-column prop="userEmail" label="用户" min-width="180" show-overflow-tooltip />
              <el-table-column label="套餐" min-width="150">
                <template #default="{ row }">{{ row.planName }} · {{ row.cycleName }}</template>
              </el-table-column>
              <el-table-column label="金额" width="100">
                <template #default="{ row }">¥{{ (row.amount || 0).toFixed(2) }}</template>
              </el-table-column>
              <el-table-column label="状态" width="100">
                <template #default="{ row }">
                  <el-tag :type="orderStatusType(row.status)" size="small">{{ orderStatusText(row.status) }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="创建时间" width="160">
                <template #default="{ row }">{{ dateText(row.createdAt) }}</template>
              </el-table-column>
              <el-table-column label="支付时间" width="160">
                <template #default="{ row }">{{ row.paidAt ? dateText(row.paidAt) : '-' }}</template>
              </el-table-column>
              <el-table-column prop="note" label="备注" min-width="180" show-overflow-tooltip />
            </el-table>
          </div>
        </section>

        <!-- 政策合规 -->
        <section v-else-if="tab === 'policies'" class="panel">
          <header class="panel-head">
            <div>
              <h2>政策合规</h2>
              <p>用户协议与隐私政策，保存后立即对 App 端生效。</p>
            </div>
            <el-button :loading="loadingPolicies" @click="loadPolicies">刷新</el-button>
          </header>

          <div class="card" v-loading="loadingPolicies">
            <div class="card-head">
              <h3>用户服务协议</h3>
              <span class="dim">v{{ policies.userAgreement.version }} · 更新于 {{ dateText(policies.userAgreement.updatedAt) }}</span>
            </div>
            <el-form label-width="80px" class="cfg-form">
              <el-form-item label="标题">
                <el-input v-model="policies.userAgreement.title" maxlength="80" />
              </el-form-item>
              <el-form-item label="版本">
                <el-input v-model="policies.userAgreement.version" placeholder="留空则自动递增，如 1.0.0 → 1.0.1" style="max-width: 320px" />
              </el-form-item>
              <el-form-item label="正文">
                <el-input
                  v-model="policies.userAgreement.content"
                  type="textarea"
                  :rows="18"
                  placeholder="支持 Markdown 语法"
                />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingUa" @click="savePolicy('userAgreement')">保存并发布</el-button>
              </el-form-item>
            </el-form>
          </div>

          <div class="card" v-loading="loadingPolicies">
            <div class="card-head">
              <h3>隐私政策</h3>
              <span class="dim">v{{ policies.privacyPolicy.version }} · 更新于 {{ dateText(policies.privacyPolicy.updatedAt) }}</span>
            </div>
            <el-form label-width="80px" class="cfg-form">
              <el-form-item label="标题">
                <el-input v-model="policies.privacyPolicy.title" maxlength="80" />
              </el-form-item>
              <el-form-item label="版本">
                <el-input v-model="policies.privacyPolicy.version" placeholder="留空则自动递增，如 1.0.0 → 1.0.1" style="max-width: 320px" />
              </el-form-item>
              <el-form-item label="正文">
                <el-input
                  v-model="policies.privacyPolicy.content"
                  type="textarea"
                  :rows="18"
                  placeholder="支持 Markdown 语法"
                />
              </el-form-item>
              <el-form-item>
                <el-button type="primary" :loading="savingPrivacy" @click="savePolicy('privacyPolicy')">保存并发布</el-button>
              </el-form-item>
            </el-form>
          </div>
        </section>
        <!-- CHUNK-4-END -->
      </main>
    </div>

    <!-- 二次验证：查看用户详情 -->
    <el-dialog v-model="pwdDialog" title="二次验证" width="420px" :close-on-click-modal="false">
      <p class="dialog-tip">查看用户「{{ targetUser && targetUser.displayName }}」的资料需要再次输入管理员密码。</p>
      <el-input
        v-model="verifyPassword"
        type="password"
        show-password
        size="large"
        placeholder="管理员密码"
        @keyup.enter="confirmDetail"
      />
      <template #footer>
        <el-button @click="pwdDialog = false">取消</el-button>
        <el-button type="primary" :loading="loadingDetail" @click="confirmDetail">验证并查看</el-button>
      </template>
    </el-dialog>

    <!-- 用户详情 -->
    <el-dialog v-model="detailDialog" title="用户详情" width="720px">
      <div v-if="detail" class="detail-wrap">
        <div class="detail-head">
          <div class="avatar">
            <img v-if="detail.user.avatarUrl" :src="detail.user.avatarUrl" alt="avatar" />
            <span v-else>{{ detail.user.displayName.slice(0, 1) }}</span>
          </div>
          <div>
            <h3>{{ detail.user.displayName }}</h3>
            <p class="dim">{{ detail.user.email }} · {{ detail.user.phone || '未绑定手机号' }}</p>
            <p class="mono dim">{{ detail.user.id }}</p>
          </div>
          <el-tag type="success" size="large">{{ fmt(detail.user.credits) }} 积分</el-tag>
        </div>

        <dl class="kv detail-kv">
          <dt>注册时间</dt><dd>{{ dateText(detail.user.createdAt) }}</dd>
          <dt>最近登录</dt><dd>{{ dateText(detail.user.lastLoginAt) }}</dd>
          <dt>最近签到</dt><dd>{{ detail.user.lastCheckinDate || '从未签到' }}</dd>
          <dt>密码哈希</dt><dd>{{ detail.user.passwordHashPresent ? '已设置' : '缺失' }}</dd>
          <dt>云端壁纸</dt>
          <dd v-if="detail.user.wallpaper">
            {{ detail.user.wallpaper.mime }} · {{ Math.round(detail.user.wallpaper.size / 1024) }} KB ·
            {{ dateText(detail.user.wallpaper.updatedAt) }}
          </dd>
          <dd v-else>无</dd>
          <dt>偏好设置</dt>
          <dd v-if="detail.settings">
            {{ detail.settings.keys.join('、') || '（空）' }} · 更新于 {{ dateText(detail.settings.updatedAt) }}
          </dd>
          <dd v-else>无</dd>
          <dt>云同步项目</dt>
          <dd>{{ detail.projects.length }} 个</dd>
          <dt>对话记录</dt>
          <dd>{{ detail.chat.count }} 条</dd>
        </dl>

        <div v-if="detail.projects.length" class="detail-projects">
          <h4>项目列表</h4>
          <el-table :data="detail.projects" size="small" max-height="200">
            <el-table-column prop="name" label="名称" width="140" />
            <el-table-column prop="path" label="路径" show-overflow-tooltip />
            <el-table-column prop="repoFullName" label="仓库" width="180" show-overflow-tooltip />
            <el-table-column label="上次编辑" width="150">
              <template #default="{ row }">{{ dateText(row.lastEditedAt) }}</template>
            </el-table-column>
          </el-table>
        </div>
      </div>
      <template #footer>
        <el-button @click="detailDialog = false">关闭</el-button>
        <el-button type="primary" @click="openCredits(detail.user)">调整积分</el-button>
      </template>
    </el-dialog>

    <!-- 调整积分 -->
    <el-dialog v-model="creditsDialog" title="调整积分" width="420px">
      <p class="dialog-tip">{{ creditsUser && creditsUser.displayName }} · 当前 {{ fmt(creditsUser && creditsUser.credits) }} 积分</p>
      <el-input-number v-model="creditsDelta" :min="-100000" :max="100000" :step="100" />
      <span class="dim" style="margin-left: 8px">正数增加，负数扣减</span>
      <template #footer>
        <el-button @click="creditsDialog = false">取消</el-button>
        <el-button type="primary" :loading="savingCredits" @click="saveCredits">确定</el-button>
      </template>
    </el-dialog>

    <!-- 生成激活码 -->
    <el-dialog v-model="codeDialog" title="生成激活码" width="560px" :close-on-click-modal="!savingCode">
      <el-form label-width="100px">
        <el-form-item label="积分面额" required>
          <el-input-number v-model="codeForm.credits" :min="1" :max="1000000" :step="1000" />
          <span class="dim" style="margin-left: 8px">每张激活码可兑换的积分</span>
        </el-form-item>
        <el-form-item label="套餐">
          <el-select v-model="codeForm.planId" clearable placeholder="选择套餐（仅用于标记，不改变面额）" style="width: 100%">
            <el-option
              v-for="p in creditPlans"
              :key="p.id"
              :label="`${p.name} · ${p.credits} 积分 · ¥${p.price}`"
              :value="p.id"
            />
          </el-select>
        </el-form-item>
        <el-form-item label="生成数量">
          <el-input-number v-model="codeForm.count" :min="1" :max="200" />
        </el-form-item>
        <el-form-item label="过期时间">
          <el-date-picker
            v-model="codeForm.expiresAt"
            type="datetime"
            placeholder="不填则永久有效"
            value-format="YYYY-MM-DDTHH:mm:ssZ"
            style="width: 100%"
          />
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="codeForm.note" maxlength="120" placeholder="例如：双十一活动 / 某渠道分销" />
        </el-form-item>
      </el-form>

      <div v-if="generatedCodes.length" class="card" style="margin-top: 8px">
        <div class="card-head">
          <h3>已生成 {{ generatedCodes.length }} 张</h3>
          <el-button link type="primary" @click="copyAllCodes">复制全部</el-button>
        </div>
        <pre class="mono pre-block">{{ generatedCodes.join('\n') }}</pre>
      </div>

      <template #footer>
        <el-button @click="codeDialog = false" :disabled="savingCode">关闭</el-button>
        <el-button type="primary" :loading="savingCode" @click="generateCodes">生成</el-button>
      </template>
    </el-dialog>

    <!-- 新增 / 编辑文档 -->
    <el-dialog v-model="docDialog" :title="docForm.id ? '编辑文档' : '新增文档'" width="720px" top="6vh">
      <el-form label-width="80px">
        <el-form-item label="标题">
          <el-input v-model="docForm.title" placeholder="例如：快速上手" maxlength="80" show-word-limit />
        </el-form-item>
        <el-form-item label="正文">
          <el-input
            v-model="docForm.content"
            type="textarea"
            :rows="16"
            placeholder="支持 Markdown：# 标题、- 列表、```代码块、[链接](https://…) 等"
          />
        </el-form-item>
        <el-form-item label="发布">
          <el-switch v-model="docForm.published" active-text="对 App 端可见" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="docDialog = false">取消</el-button>
        <el-button type="primary" :loading="savingDoc" @click="saveDoc">保存</el-button>
      </template>
    </el-dialog>

    <!-- 新增 / 编辑模型 -->
    <el-dialog v-model="modelDialog" :title="modelForm.id ? '编辑模型' : '新增模型'" width="720px">
      <el-form label-width="100px">
        <el-form-item label="显示名称">
          <el-input v-model="modelForm.name" placeholder="例如 GPT-4o" />
        </el-form-item>
        <el-form-item label="上游模型">
          <el-input v-model="modelForm.model" placeholder="gpt-4o-mini" />
        </el-form-item>
        <el-form-item label="积分倍率">
          <el-input-number v-model="modelForm.multiplier" :min="0.1" :step="0.1" :precision="1" />
          <span class="dim" style="margin-left: 8px">倍率越低越便宜，0.2 ≈ 5000 token/积分</span>
        </el-form-item>
        <el-form-item label="图片理解">
          <el-switch v-model="modelForm.supportsVision" active-text="支持图片输入" />
          <span class="dim" style="margin-left: 8px">开启后允许用户上传图片；未开启时服务端会拒绝图片请求</span>
        </el-form-item>
        <el-form-item label="模型简介">
          <el-input v-model="modelForm.description" maxlength="120" placeholder="展示在 App 模型选择器中，可选" />
        </el-form-item>

        <el-divider content-position="left">
          <span class="dim">线路（可配置多组 BaseURL / APIKey，自动故障切换）</span>
        </el-divider>
        <div v-for="(channel, index) in modelForm.channels" :key="index" class="channel-row">
          <div class="channel-head">
            <strong>线路 {{ index + 1 }}</strong>
            <el-input
              v-model="channel.name"
              size="small"
              placeholder="线路备注"
              style="max-width: 180px"
            />
            <el-switch v-model="channel.enabled" size="small" active-text="启用" />
            <el-button
              link
              type="danger"
              size="small"
              :disabled="modelForm.channels.length <= 1"
              @click="removeModelChannel(index)"
            >
              删除
            </el-button>
          </div>
          <el-input
            v-model="channel.apiBase"
            placeholder="https://api.stepfun.com/v1/chat/completions（也可填到 /v1，自动补全）"
            style="margin-bottom: 8px"
          />
          <el-input
            v-model="channel.apiKey"
            type="password"
            show-password
            placeholder="该线路的 API Key"
          />
        </div>
        <el-button size="small" @click="addModelChannel">+ 添加线路</el-button>
      </el-form>
      <template #footer>
        <el-button @click="modelDialog = false">取消</el-button>
        <el-button type="primary" :loading="savingModel" @click="saveModel">保存</el-button>
      </template>
    </el-dialog>
  </script>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/element-plus.full.min.js"></script>
  <script src="/vendor/element-plus-zh-cn.js"></script>
  <script src="/app.js"></script>
</body>
</html>

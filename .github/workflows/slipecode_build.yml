name: SLIPE Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标'
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.target != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env 在 .gitignore 中，但 pubspec 将其声明为 asset，缺失会导致构建失败
      # 以下均为公开的非机密配置（OAuth 公开 client id 与后端地址），client_secret 仅在服务端
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          GITHUB_CLIENT_ID=Ov23li26aNK8JhfG6weT
          GITHUB_OAUTH_REDIRECT_URI=https://ser1996.niav.cn/api/oauth/github/callback
          GITHUB_DEEP_LINK=slipecode://oauth/callback
          GITHUB_OAUTH_SCOPES=repo workflow read:user
          GITHUB_API_BASE=https://api.github.com
          GITHUB_OAUTH_BASE=https://github.com/login/oauth
          GITEE_CLIENT_ID=6d44003e515e38e6b6723a9cea8ebe07447e5bd342a5c724555b6af6f69eea4d
          GITEE_OAUTH_REDIRECT_URI=slipecode://oauth/gitee/callback
          GITEE_OAUTH_SCOPES=projects user_info
          GITEE_API_BASE=https://gitee.com/api/v5
          GITEE_OAUTH_BASE=https://gitee.com/oauth
          ACCOUNT_BACKEND_BASE_URL=https://ser1996.niav.cn
          EOF

      - name: Pub get
        run: flutter pub get

      # 极验 GT4 AAR 的 aar-metadata 要求 minCompileSdk=37；
      # SDK 37 采用新的小版本包名（platforms;android-37.0），需显式安装
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slipecode-editor-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # iOS 由 macOS Runner 构建；暂未配置 Developer 证书，先产出未签名产物
  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'ios' || inputs.target == 'all') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          GITHUB_CLIENT_ID=Ov23li26aNK8JhfG6weT
          GITHUB_OAUTH_REDIRECT_URI=https://ser1996.niav.cn/api/oauth/github/callback
          GITHUB_DEEP_LINK=slipecode://oauth/callback
          GITHUB_OAUTH_SCOPES=repo workflow read:user
          GITHUB_API_BASE=https://api.github.com
          GITHUB_OAUTH_BASE=https://github.com/login/oauth
          GITEE_CLIENT_ID=6d44003e515e38e6b6723a9cea8ebe07447e5bd342a5c724555b6af6f69eea4d
          GITEE_OAUTH_REDIRECT_URI=slipecode://oauth/gitee/callback
          GITEE_OAUTH_SCOPES=projects user_info
          GITEE_API_BASE=https://gitee.com/api/v5
          GITEE_OAUTH_BASE=https://gitee.com/oauth
          ACCOUNT_BACKEND_BASE_URL=https://ser1996.niav.cn
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          set -e
          mkdir -p build/ios-artifact
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios-artifact/slipecode-editor-ios-unsigned.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipecode-editor-ios-unsigned
          path: build/ios-artifact/slipecode-editor-ios-unsigned.zip
          if-no-files-found: error

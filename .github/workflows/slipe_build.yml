name: SLIPE Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'apk-release'
        options:
          - apk-release
          - apk-debug
          - appbundle-release
          - ios-release

jobs:
  build-android:
    # push 触发只跑 Android；iOS 需要 macOS Runner，不随 push 自动执行
    if: ${{ github.event_name == 'push' || inputs.build_type != 'ios-release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 极验 GT4 AAR 要求 compileSdk=37；GitHub ubuntu-latest 预装的 SDK 可能
      # 不含 android-37.0，需手动安装并创建 android-37 软链（AGP 按纯数字查找）
      - name: Install Android 37 platform
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-37.0" >/dev/null
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi

      # 仅当平台目录缺失时才用 flutter create 补齐；
      # 若仓库已提交完整的 android/ 目录则直接复用，否则会覆盖自定义的
      # AndroidManifest / MainActivity / 前台服务与 JGit 依赖。
      - name: Generate platform files
        run: |
          set -e
          if [ ! -d android ]; then
            if [ -f .slipe.json ]; then
              ORG=$(jq -r '.org // "com.example"' .slipe.json)
              NAME=$(jq -r '.project_name // empty' .slipe.json)
              flutter create --org "$ORG" --platforms=android ${NAME:+--project-name "$NAME"} .
            else
              flutter create --platforms=android .
            fi
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'apk-release' }}
        run: |
          set -e
          # 自定义 Payload 图标从持久化数据动态还原（iconFromMap），
          # 属于合法的非常量 IconData 调用，必须关闭 icon tree-shaking
          case "$BUILD_TYPE" in
            apk-debug)
              flutter build apk --debug --no-tree-shake-icons
              ;;
            appbundle-release)
              flutter build appbundle --release --no-tree-shake-icons
              ;;
            *)
              flutter build apk --release --no-tree-shake-icons
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipe-${{ inputs.build_type || 'apk-release' }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/**/*.aab
          if-no-files-found: error

  build-ios:
    # iOS 仅手动触发，使用 macOS Runner；先不签名
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'ios-release' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: |
          set -e
          if [ ! -d ios ]; then
            if [ -f .slipe.json ]; then
              ORG=$(jq -r '.org // "com.example"' .slipe.json)
              NAME=$(jq -r '.project_name // empty' .slipe.json)
              flutter create --org "$ORG" --platforms=ios ${NAME:+--project-name "$NAME"} .
            else
              flutter create --platforms=ios .
            fi
          fi

      - name: Pub get
        run: flutter pub get

      # Developer 证书暂未配置，先构建无签名产物
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Runner.app
        run: |
          set -e
          mkdir -p build/ios-artifact
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios-artifact/slipe-ios-unsigned.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipe-ios-release
          path: build/ios-artifact/slipe-ios-unsigned.zip
          if-no-files-found: error
